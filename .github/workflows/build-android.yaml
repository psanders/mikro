name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mods/mobile/**"
      - "mods/common/**"
      - "package.json"
      - "package-lock.json"

# contents: write lets the job attach the APK to the consolidated GitHub
# Release on release commits (see the attach step below).
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    # A healthy cold build is ~30 min. Cap well above that so a genuinely
    # stuck build fails fast instead of burning the 6h default.
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://mikro.ngrok-free.dev' }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Gradle home under a single dedicated prefix so the "Prune Gradle
      # cache before save" step and the cache action have one path to
      # target. (On the current ubuntu-latest image /mnt is the same
      # partition as / — the disk headroom comes from the "Free disk space"
      # step, not from a separate volume.)
      GRADLE_USER_HOME: /mnt/gradle

    steps:
      - uses: actions/checkout@v6

      # build-android was broken on every main push for a month. Two causes,
      # both handled here:
      #
      # 1. DISK. The runner's root partition has only a few GB free after
      #    preinstalled tooling — not enough for node_modules + the
      #    generated android/ project + Gradle's dependency cache +
      #    KSP/Kotlin build outputs + the APK on a cold build. It overran
      #    and the runner died: sometimes an explicit "No space left on
      #    device", sometimes an opaque "runner lost communication with the
      #    server" once the runner agent's own diag log was the first write
      #    to fail. Either way NO step logs upload (`gh run view --log` is
      #    empty, the log blob 404s) — the cause is only in the job's
      #    check-run annotations. Fix: delete preinstalled toolchains this
      #    job never touches (~10GB back).
      # 2. MEMORY. The expo-updates KSP/Kotlin compile spikes RAM; combined
      #    with the Gradle heap it could get the runner agent OOM-killed
      #    (also surfacing as "lost communication"). Fix: an 8GB swapfile,
      #    plus a capped heap and worker count (later steps).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /opt/ghc /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/google-cloud-sdk /opt/az
          sudo docker image prune --all --force

          sudo mkdir -p /mnt/gradle
          sudo chown -R "$(id -u):$(id -g)" /mnt/gradle

          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          df -h /
          free -h

      # No `cache: npm` — a cold `npm ci` here is only ~60s and the cache
      # save/restore just adds disk churn to a job that is tight on space.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Cache only the dependency store + wrapper (bounded, ~1-2GB), NOT
      # the whole GRADLE_USER_HOME. The previous cache also captured
      # build-cache and transforms, and `restore-keys: gradle-` re-saves
      # the newest cache on every exact-key miss, so it grew without bound
      # until it was itself the thing filling the disk.
      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            /mnt/gradle/caches/modules-2
            /mnt/gradle/wrapper
          key: gradle-${{ hashFiles('mods/mobile/package.json', 'mods/mobile/app.config.ts', 'package-lock.json') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      # --clean removes any stale android/ directory before regenerating
      - name: Generate native Android project
        working-directory: mods/mobile
        run: npx expo prebuild --platform android --clean

      # The Expo template defaults to -Xmx2048m -XX:MaxMetaspaceSize=512m,
      # which the expo-updates Kotlin/KSP compile blows through (endless
      # "OutOfMemoryError: Metaspace" — reproduced locally and on CI). The
      # MaxMetaspaceSize=1g bump is the actual fix for that. Heap is held
      # at 4g (not EAS's 5g — their workers are bigger): on a 16GB runner,
      # 5g heap + KSP workers + Node + system pushed total RSS into swap
      # thrash and eventually an OOM-killed runner. gradle.properties is
      # generated by prebuild, so the edit lives here.
      #
      # NOTE: Expo generates gradle.properties WITHOUT a trailing newline
      # (last line is `expo.inlineModules.watchedDirectories=[]`). A naive
      # `echo x >> gradle.properties` glues onto that line and corrupts the
      # watchedDirectories value, which then fails JSON.parse in
      # expo-modules-autolinking's mirror-kotlin-inline-modules command
      # ("Process 'command 'node'' finished with non-zero exit value 1" at
      # configuration time). Only the in-place `sed` substitution is safe;
      # worker count goes on the gradlew CLI (--max-workers below), not the
      # file.
      - name: Raise Gradle JVM memory
        working-directory: mods/mobile/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep -E '^org.gradle.jvmargs=' gradle.properties

      # assembleRelease bundles the JS into the APK so it runs standalone (no Metro).
      # Expo's prebuild template signs release with the debug keystore, so the APK
      # installs without any signing secrets — fine for internal distribution.
      # --no-daemon prevents orphaned Gradle processes on the runner.
      - name: Build release APK
        working-directory: mods/mobile/android
        run: |
          df -h /
          ./gradlew assembleRelease --no-daemon --max-workers=2
          df -h /

      # Best-effort housekeeping so the saved cache stays bounded: drop
      # lock files and the build-scoped caches that don't need to survive.
      # `continue-on-error` + `exit 0` — never fail the build over this
      # (an earlier version of this step exited non-zero and reddened an
      # otherwise-green run, which is why its fix branch never merged).
      - name: Prune Gradle cache before save
        if: always()
        continue-on-error: true
        run: |
          set +e
          find /mnt/gradle/caches -name "*.lock" -delete
          rm -rf /mnt/gradle/caches/build-cache-1 /mnt/gradle/caches/journal-1 \
            /mnt/gradle/caches/transforms-* /mnt/gradle/caches/*/kotlin-dsl
          du -sh /mnt/gradle/caches 2>/dev/null
          exit 0

      # Release commits (pushed by release.yaml) carry a vX.Y.Z tag on HEAD.
      # Attach the APK to that tag's GitHub Release so it lands on the
      # consolidated release page permanently, instead of expiring with the
      # 30-day workflow artifact. release.yaml creates the Release seconds
      # after pushing the tag — long before Gradle finishes here — but the
      # retry loop covers any gap. Non-release pushes skip this step.
      - name: Attach APK to GitHub Release (release commits only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --quiet
          tag="$(git tag --points-at HEAD | grep '^v' | head -1 || true)"
          if [ -z "$tag" ]; then
            echo "HEAD is not a release commit; keeping the workflow artifact only"
            exit 0
          fi
          cp mods/mobile/android/app/build/outputs/apk/release/app-release.apk "mikro-$tag-android.apk"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "mikro-$tag-android.apk" --clobber; then
              echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Release $tag not ready yet (attempt $attempt); retrying in 60s"
            sleep 60
          done
          echo "::warning::Could not attach APK to release $tag"

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: mikro-android-${{ github.run_number }}-${{ github.sha }}
          path: mods/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # One-stop note on the run's Summary page so nobody digs through the
      # Artifacts section (or the logs) to find the APK.
      - name: Add build links to job summary
        run: |
          {
            echo "### 📦 Android APK"
            echo "- Download: [mikro-android-${{ github.run_number }}-${{ github.sha }}](${{ steps.upload-apk.outputs.artifact-url }})"
            echo "- Retention: 30 days"
            if [ -n "$RELEASE_TAG" ]; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
