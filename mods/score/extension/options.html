<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mikro · Decisión</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: #14254a;
        background: #f4f7fb;
        margin: 0;
      }
      main {
        max-width: 380px;
        margin: 40px auto;
        background: #fff;
        border: 1px solid #e5eaf1;
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.sub {
        color: #697a93;
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #697a93;
        margin: 12px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #e5eaf1;
        border-radius: 8px;
        padding: 9px 10px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 11px;
        font: 600 14px system-ui;
        color: #fff;
        background: #1f4aa8;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #14254a;
        border: 1px solid #e5eaf1;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
      }
      .ok {
        color: #16a34a;
      }
      .err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mikro · Decisión</h1>
      <p class="sub">
        Inicia sesión con tu cuenta de Mikro (mismo teléfono y contraseña que la app de Ops).
      </p>
      <form id="login">
        <label for="apiUrl">Servidor de Mikro</label>
        <input id="apiUrl" type="url" placeholder="https://…" required />
        <label for="phone">Teléfono</label>
        <input id="phone" type="tel" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit">Iniciar sesión</button>
      </form>
      <button id="logout" class="secondary" hidden>Cerrar sesión</button>
      <div id="status"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
